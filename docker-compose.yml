services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  app_1:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      - PORT=8080
      - REDIS_ADDR=redis:6379
      - INSTANCE_ID=app-1
    depends_on:
      redis:
          condition: service_healthy

  app_2:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8082:8080"
    environment:
      - PORT=8080
      - REDIS_ADDR=redis:6379
      - INSTANCE_ID=app-2
    depends_on:
      redis:
          condition: service_healthy
