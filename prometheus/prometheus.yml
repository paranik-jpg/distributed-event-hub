global:
  scrape_interval: 5s  # How often Prometheus asks our apps: "Give me your current numbers"

scrape_configs:
  - job_name: "distributed-event-hub"
    static_configs:
      - targets: ["app_1:8080", "app_2:8080"] # The two Docker containers Prometheus will query
        labels:
          group: "hub-cluster" # a grouping tag—like a category or namespace for our servers!
