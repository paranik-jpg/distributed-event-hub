# metrics.go computes the lag numbers and holds them in memory, main.go serves those numbers over HTTP on /metrics, and Prometheus visits /metrics to record them 
# and plot graphs.

global:
  # How often Prometheus asks our apps: "Give me your current numbers"
  scrape_interval: 5s  

scrape_configs:
  - job_name: "distributed-event-hub"
    static_configs:
      # The two Docker containers Prometheus will query
      - targets: ["app_1:8080", "app_2:8080"] 
        labels:
          # a grouping tag—like a category or namespace for our servers!
          group: "hub-cluster" 
